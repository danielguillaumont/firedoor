# Firedoor v0.1 local-only kind cluster configuration.
# Kubernetes node image pinned in New-FiredoorCluster.ps1 (v1.36.4 + SHA256).
# WARNING: Nodes will be NotReady until Calico CNI is installed.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
