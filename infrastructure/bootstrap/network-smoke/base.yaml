# Disposable v0.1 network policy smoke test. Only install into kind-firedoor-local.
apiVersion: v1
kind: Namespace
metadata:
  name: firedoor-netcheck
  labels:
    app.kubernetes.io/part-of: firedoor
    firedoor.dev/purpose: networkpolicy-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
  namespace: firedoor-netcheck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firedoor-netcheck-target
  template:
    metadata:
      labels:
        app: firedoor-netcheck-target
    spec:
      containers:
        - name: http-server
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - "mkdir -p /www; echo FIREDOOR_OK > /www/index.html; exec httpd -f -p 8080 -h /www"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed
  namespace: firedoor-netcheck
  labels:
    role: allowed
spec:
  containers:
    - name: client
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: denied
  namespace: firedoor-netcheck
  labels:
    role: denied
spec:
  containers:
    - name: client
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 36000"]
