name: Foundation quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Go formatting check
        run: |
          test -z "$(gofmt -l cmd internal pkg)"
      - name: Verify module dependencies
        run: go mod verify
      - name: Test + vet + build
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/firedoor
      - name: CLI help
        run: go run ./cmd/firedoor --help

  console-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/console/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run all frontend tests
        run: npm test
      - name: Production frontend build
        run: npm run build

  terraform-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
      - name: Terraform fmt
        run: terraform -chdir=infrastructure/terraform/testbed fmt -check -recursive
      - name: Terraform init - local only
        run: terraform -chdir=infrastructure/terraform/testbed init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infrastructure/terraform/testbed validate

# Source-quality gates only: CI does not create kind clusters, run Terraform apply,
# collect security evidence, or attest NetworkPolicy enforcement.
